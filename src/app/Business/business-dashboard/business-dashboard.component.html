<div class="container-fluid body">
  <div class="row">

<nav class="navbar navbar-dark bg-success sticky-top px-3 ">
  <button
    class="navbar-toggler d-md-none"
    type="button"
    data-bs-toggle="offcanvas"
    data-bs-target="#sidebar"
  >
    <span class="navbar-toggler-icon"></span>
  </button>

  <a class="navbar-brand fw-bold ms-2" routerLink="/home" data-toggle="tooltip" data-placement="top" title="Home">
    InnoVITA Bill
  </a>

  <div class="ms-auto d-flex align-items-center">
    <div class="me-3 text-white text-end d-none d-md-block">
      <div class="fw-bold">{{ loggedInBusiness?.name }}</div>
      <small ><b>Role</b>  : Business</small>
    </div>

    <div class="dropdown">
      <a class="nav-link text-white dropdown-toggle" data-bs-toggle="dropdown"data-toggle="tooltip" data-placement="top" title="Profile">
        <i class="bi bi-person-circle fs-3"></i>
      </a>

      <ul class="dropdown-menu dropdown-menu-end">
        <li>
          <a class="dropdown-item" routerLink="businessprofile">
            <i class="bi bi-person me-2" ></i> Profile
          </a>
        </li>
        <li><hr class="dropdown-divider" /></li>
        <li>
          <a class="dropdown-item"
           data-bs-toggle="modal"
                data-bs-target="#logoutModal"
                >
            <i class="bi bi-box-arrow-right me-2 "></i> Logout
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

 <div class="modal fade" id="logoutModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body">
          <p class="mb-0 fs-5">Are you sure you want to logout?</p>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>

          <button
            type="button"
            class="btn btn-danger"
            data-bs-toggle="modal"
            data-bs-target="#logoutModal"
            (click)="logout()"
          >
            Yes, Logout
          </button>
        </div>
      </div>
    </div>
  </div>
