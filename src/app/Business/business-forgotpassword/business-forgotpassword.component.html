<nav class="navbar navbar-expand-lg navbar-dark bg-success px-3 fixed-top">
  <a
    class="navbar-brand text-white fw-bold"
    style="cursor: pointer"
    routerLink="/home"
  >
    InnoVITA Bill
  </a>
</nav>
<div
  class="d-flex justify-content-center align-items-center"
  style="min-height: 100vh; padding-top: 60px"
>
  <div
    class="card shadow p-4 w-100"
    style="max-width: 400px; border-radius: 12px"
  >
    <h3 class="mb-3 text-center text-success">Forgot Password</h3>

    <form [formGroup]="forgotForm">
      <div class="mb-3">
        <label for="email" class="form-label">Enter your Email</label>
        <input
          type="email"
          id="email"
          class="form-control"
          formControlName="email"
          placeholder="example@email.com"
          [class.is-invalid]="
            forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched
          "
        />

        <div
          class="invalid-feedback"
          *ngIf="
            forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched
          "
        >
          Please enter a valid email address
        </div>
      </div>

      <button
        type="button"
        class="btn btn-primary w-100"
        (click)="forgot()"
        [disabled]="loading || forgotForm.invalid"
      >
        {{ loading ? "Sending..." : "Send Reset Link" }}
      </button>
    </form>

    <div class="mt-3 text-center">
      <span class="text-success" *ngIf="message">{{ message }}</span>
    </div>
  </div>
</div>
