<div
  class="container d-flex justify-content-center align-items-center"
  style="min-height: 100vh"
>
  <div class="card shadow p-4" style="width: 350px">
    <div class="position-fixed top-0 end-0 p-4" style="z-index: 1080">
      <div *ngIf="toastMessage" class="custom-toast" [ngClass]="toastType">
        <div class="d-flex justify-content-between align-items-center">
          <span>{{ toastMessage }}</span>
          <button class="btn-close ms-3" (click)="toastMessage = null"></button>
        </div>
      </div>
    </div>
    <h3 class="text-center mb-3 text-primary">Reset Password</h3>

    <form [formGroup]="resetForm" (ngSubmit)="update()">
      <div class="mb-3">
        <label class="form-label fw-semibold">New Password</label>
        <input
          type="password"
          formControlName="newPassword"
          class="form-control"
          placeholder="Enter new password"
        />
        <small
          class="text-danger"
          *ngIf="
            resetForm.get('newPassword')?.touched &&
            resetForm.get('newPassword')?.invalid
          "
        >
          Password is required (min 6 characters)
        </small>
      </div>

      <button
        class="btn btn-primary w-100 mt-2"
        type="submit"
        [disabled]="resetForm.invalid"
      >
        Update Password
      </button>
    </form>
  </div>
</div>
