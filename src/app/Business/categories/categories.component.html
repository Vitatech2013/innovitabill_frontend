<div class="position-fixed top-1 end-0 p-1" style="z-index: 1080">
  <div
    *ngIf="toastMessage"
    class="toast align-items-center text-light border-0 fade show shadow-lg"
    [ngClass]="{
      'bg-success': toastType === 'success',
      'bg-danger': toastType === 'error',
      'bg-warning text-dark': toastType === 'warning',
    }"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="d-flex">
      <div class="toast-body fw-semibold">
        {{ toastMessage }}
      </div>
      <button
        type="button"
        class="btn-close btn-close-white me-2 m-auto"
        (click)="toastMessage = null"
        aria-label="Close"
      ></button>
    </div>
  </div>
</div>
<div class="p-4">
  <div class="col-12">
    <div
      class="d-flex justify-content-between align-items-center"
    >
      <!-- Heading -->
      <h4 class="fw-bold text-success" style="padding-left: 18px;">Manage Categories</h4>

      <!-- Search Bar -->
      <input
        type="text"
        class="form-control shadow-sm "
        placeholder="Search..."
        [(ngModel)]="searchTerm"
        style="max-width: 300px"
      />

     <div class="d-flex align-items-center gap-2">
          <label class="fw-bold text-success mb-0">STATUS:</label>
       <div class="dropdown">
          <button
            class="btn btn-light text-dark fw-semibold dropdown-toggle bg shadow-sm"
            type="button"
            data-toggle="tooltip" data-placement="top" title="Status"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            style="width: 100px"
          >
            {{ selectedFilter }}
          </button>

          <ul class="dropdown-menu">
            
            <li>
              <button class="dropdown-item" (click)="changeFilter('All')">
                All
              </button>
            </li>
            <li>
              <button class="dropdown-item" (click)="changeFilter('Active')">
                Active
              </button>
            </li>
            <li>
              <button class="dropdown-item" (click)="changeFilter('Inactive')">
                Inactive
              </button>
            </li>
          </ul>
        </div>
        </div>

      <button
        class="btn btn-light text-dark fw-semibold shadow-sm"
        data-bs-toggle="modal"
        data-bs-target="#CategoryModal"
        (click)="openAddModal()"
        data-toggle="tooltip" data-placement="top" title="status"
      >
        <i class="bi bi-plus-circle"></i>
        Add New
      </button>
    </div>
  </div>
  <div class="dashboard">
    <div class="row">
      <div *ngIf="categories.length === 0" class="text-center mt-4">
        <div class="alert alert-info shadow-sm py-3">
          <i class="bi bi-info-circle"></i> No data found.
        </div>
      </div>
      <div class="col-12" *ngIf="categories.length > 0">
        <div class="table-wrapper">
          <div class="table-responsive bg-white p-3 rounded-4">
            <table class="table table-bordered table-hover align-middle">
              <thead class="table-success text-start">
                <tr>
                  <th class="light-green">S.No</th>
                  <th class="light-green">
                    Category Name
                  </th>
                  <th class="light-green">
                    Category Code
                  </th>
                  <th class="light-green">Status</th>
                  <th class="light-green">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr
                  *ngFor="let c of filteredByStatus(); let i = index"
                  class="align-middle text-start"
                >
                  <td>{{ i + 1 }}</td>
                  <td>{{ c.categories_name }}</td>
                  <td>{{ c.categories_code }}</td>
                    <td>
                      <span
                        class="badge"
                        [ngClass]="
                          c.status === 'active' ? 'bg-success' : 'bg-danger'
                        "
                      >
                        {{ c.status }}
                      </span>
                    </td>
                  <td>
                    <button
                      class="btn btn-sm btn-outline-primary me-2"
                      (click)="edit(c)"
                      data-bs-toggle="modal"
                      data-bs-target="#CategoryModal"
                      data-toggle="tooltip" data-placement="top" title="Edit"
                    >
                      <i class="bi bi-pencil-square"></i>
                    </button>
                    <button
                      class="btn btn-sm btn-outline-danger"
                      (click)="openDeleteModal(c)"
                      data-toggle="tooltip" data-placement="top" title="Delete"
                    >
                      <i class="bi bi-trash"></i>
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div
        class="modal fade"
        id="CategoryModal"
        tabindex="-1"
        aria-labelledby="CategoryModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered modal-sm">
          <div class="modal-content">
            <form
              [formGroup]="categoryForm"
              (ngSubmit)="createOrUpdateCategory()"
            >
              <div class="modal-header">
                <h5 class="modal-title" id="CategoryModalLabel">{{ title }}</h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                  (click)="closeModal()"
                  data-toggle="tooltip" data-placement="top" title="Close"
                ></button>
              </div>

              <div class="modal-body">
                <div class="row g-3">
                  <div class="col-md-12 mb-2">
                    <label class="form-label">Category Name</label>
                    <input
                      type="text"
                      formControlName="categories_name"
                      class="form-control"
                      placeholder="Enter Category Name"
                      (keypress)="allowOnlyLetters($event)"
                    />
                    <div
                      *ngIf="
                        categoryForm.controls['categories_name']?.touched &&
                        categoryForm.controls['categories_name']?.invalid
                      "
                    >
                      <small
                        *ngIf="
                          categoryForm.controls['categories_name']?.errors?.[
                            'required'
                          ]
                        "
                        class="text-danger"
                      >
                        Category Name is required
                      </small>
                    </div>
                  </div>

                  <!-- <div class="col-md-4 mb-2">
                    <label class="form-label">Category Code</label>
                    <input
                      type="text"
                      formControlName="categories_code"
                      class="form-control"
                      placeholder="Enter Category Code"
                      (keypress)="blockSpaces($event)"
                    />
                    <div
                      *ngIf="
                        categoryForm.controls['categories_code']?.touched &&
                        categoryForm.controls['categories_code']?.invalid
                      "
                    >
                      <small
                        *ngIf="
                          categoryForm.controls['categories_code']?.errors?.[
                            'required'
                          ]
                        "
                        class="text-danger"
                      >
                        Code is required
                      </small>
                    </div>
                  </div> -->
                  <div class="col-md-12 mb-2" *ngIf="selectedCategoryId">
                    <label class="form-label fw-semibold">Status</label>
                    <select class="form-select" formControlName="status">
                      <option value="">Select Status</option>
                      <option value="active">Active</option>
                      <option value="inactive">Inactive</option>
                    </select>
                  </div>
                </div>
              </div>

              <div class="modal-footer">
              <button type="submit" class="btn btn-success">
  <i *ngIf="!selectedCategoryId" class="bi bi-save me-1"></i>
  {{ selectedCategoryId ? "Update" : "Save" }}
</button>
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                  (click)="closeModal()"
                  data-toggle="tooltip" data-placement="top" title="Close"
                >
                  Close
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!--  Delete Confirmation Modal -->
      <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header text-danger">
              <h5 class="modal-title">Confirm Delete</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>

            <div class="modal-body">
              Are you sure you want to delete
              <strong>{{ selectedId?.categories_name }}</strong
              >?
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
                data-toggle="tooltip" data-placement="top" title="Cancel"
              >
                Cancel
              </button>
              <button
                type="button"
                class="btn btn-danger"
                (click)="confirmDelete()"
                data-toggle="tooltip" data-placement="top" title="Delete"
              >
                Delete
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
