<div class="position-fixed top-1 end-0 p-1" style="z-index: 1080">
  <div
    *ngIf="toastMessage"
    class="toast align-items-center text-light border-0 fade show shadow-lg"
    [ngClass]="{
      'bg-success': toastType === 'success',
      'bg-danger': toastType === 'error',
      'bg-warning text-dark': toastType === 'warning',
    }"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="d-flex">
      <div class="toast-body fw-semibold">
        {{ toastMessage }}
      </div>
      <button
        type="button"
        class="btn-close btn-close-white me-2 m-auto"
        (click)="toastMessage = null"
        aria-label="Close"
      ></button>
    </div>
  </div>
</div>
<div class=" p-4 ">
  <div class="col-12">
    <div
      class="d-flex justify-content-between align-items-center "
    >
      <!-- Heading -->
      <h4 class="fw-bold text-success" style="padding-left: 18px;">Manage Roles</h4>

      <!-- Search Bar -->
      <input
        type="text"
        class="form-control shadow-sm"
        placeholder="Search..."
        [(ngModel)]="searchTerm"
        style="max-width: 300px"
      />

     <div class="d-flex align-items-center gap-2">
          <label class="fw-bold text-success mb-0">STATUS:</label>
       <div class="dropdown">
          <button
            class="btn btn-light text-dark fw-semibold dropdown-toggle bg"
            type="button"
            data-toggle="tooltip" data-placement="top" title="Status"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            style="width: 100px"
          >
            {{ selectedFilter }}
          </button>

          <ul class="dropdown-menu">
            
            <li>
              <button class="dropdown-item" (click)="changeFilter('All')">
                All
              </button>
            </li>
            <li>
              <button class="dropdown-item" (click)="changeFilter('Active')">
                Active
              </button>
            </li>
            <li>
              <button class="dropdown-item" (click)="changeFilter('Inactive')">
                Inactive
              </button>
            </li>
          </ul>
        </div>
        </div>
<!-- 
      <button
        class="btn btn-light text-dark fw-semibold"
        data-bs-toggle="modal"
        data-bs-target="#roleModal"
        (click)="openAddModal()"
        data-toggle="tooltip" data-placement="top" title="Add Role"
      >
        <i class="bi bi-plus-circle"></i>
        Add New
      </button> -->
    </div>
  </div>

  <div class="dashboard">
    <div class="row">
      <div *ngIf="roles.length === 0" class="text-center mt-4">
        <div class="alert alert-info shadow-sm py-3">
          <i class="bi bi-info-circle"></i> No data found.
        </div>
      </div>

      <div class="col-12" *ngIf="roles.length > 0">
        <div class="table-wrapper">
          <div class="table-responsive bg-white p-3 rounded-4">
            <table
              *ngIf="roles.length > 0"
              class="table table-bordered table-hover shadow-sm align-middle text-start"
            >
              <thead class="table-success sticky-header">
                <tr>
                  <th class="light-green">S.No</th>
                  <th class="light-green">Role Name</th>
                  <th class="light-green">
                    Role Number
                  </th>
                  <th class="light-green">Status</th>
                  <th class="light-green">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr
                  *ngFor="let r of filteredByStatus(); let i = index"
                  class="align-middle text-start"
                >
                  <td>{{ i + 1 }}</td>
                  <td>{{ r.role_name }}</td>
                  <td>{{ r.role_number }}</td>
                   <td>
                      <span
                        class="badge"
                        [ngClass]="
                          r.status === 'active' ? 'bg-success' : 'bg-danger'
                        "
                      >
                        {{ r.status }}
                      </span>
                    </td>
                  <td>
                    <button
                      class="btn btn-sm btn-outline-primary me-2"
                      (click)="edit(r)"
                      data-bs-toggle="modal"
                      data-bs-target="#roleModal"
                      data-toggle="tooltip" data-placement="top" title="Edit"
                    >
                      <i class="bi bi-pencil-square"></i>
                    </button>
                    <button
                      class="btn btn-sm btn-outline-danger"
                      (click)="openDeleteModal(r)"
                      data-toggle="tooltip" data-placement="top" title="Delete"
                    >
                      <i class="bi bi-trash"></i>
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Role Modal -->
  <div
    class="modal fade"
    #roleModal
    id="roleModal"
    tabindex="-1"
    aria-labelledby="roleModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <form [formGroup]="roleForm" (ngSubmit)="createOrUpdateRole()">
          <div class="modal-header text-white bg-success">
            <h5 class="modal-title" id="roleModalLabel">{{ title }}</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
              data-toggle="tooltip" data-placement="top" title="Close"
            ></button>
          </div>

          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-12 mb-2">
                <label class="form-label">Role Name</label>
                <input
                  type="text"
                  formControlName="role_name"
                  class="form-control"
                  placeholder="Enter role name"
                  (keypress)="allowOnlyLetters($event)"
                />
                <div
                  *ngIf="
                    roleForm.controls['role_name']?.touched &&
                    roleForm.controls['role_name']?.invalid
                  "
                >
                  <small
                    *ngIf="roleForm.controls['role_name']?.errors?.['required']"
                    class="text-danger"
                  >
                    Role Name is required and must be at least 3 letters</small
                  >
                </div>
              </div>

              <!-- <div class="col-md-4 mb-2">
                <label class="form-label">Role Number</label>
                <input
                  type="text"
                  formControlName="role_number"
                  class="form-control"
                  placeholder="Enter role number"
                  (keypress)="blockSpaces($event)"
                />
                <div
                  *ngIf="
                    roleForm.controls['role_number']?.touched &&
                    roleForm.controls['role_number']?.invalid
                  "
                >
                  <small
                    *ngIf="
                      roleForm.controls['role_number']?.errors?.['required']
                    "
                    class="text-danger"
                    >Role Number is required</small
                  >
                </div>
              </div> -->
           <div class="col-md-12 mb-2" *ngIf="selectedUserId">
  <label class="form-label fw-semibold">Status</label>
  <select class="form-select" formControlName="status">
    <option value="">Select Status</option>
    <option value="active">Active</option>
    <option value="inactive">Inactive</option>
  </select>
</div>
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
              data-toggle="tooltip" data-placement="top" title="Close"
            >
              Close
            </button>
           <button type="submit" class="btn btn-success">
  <i *ngIf="!selectedUserId" class="bi bi-save me-1"></i>
  {{ selectedUserId ? "Update" : "Save" }}
</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header text-danger">
          <h5 class="modal-title">Confirm Delete</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
          ></button>
        </div>

        <div class="modal-body">
          Are you sure you want to delete
          <strong>{{ selectedRole?.role_name }}</strong
          >?
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
            data-toggle="tooltip" data-placement="top" title="Cancel"
          >
            Cancel
          </button>
          <button
            type="button"
            class="btn btn-danger"
            (click)="confirmDelete()"
            data-toggle="tooltip" data-placement="top" title="Delete"
          >
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
