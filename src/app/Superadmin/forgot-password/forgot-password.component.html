<nav class="navbar navbar-expand-lg navbar-dark bg-success px-3 fixed-top">
  <a
    class="navbar-brand text-white fw-bold"
    style="cursor: pointer"
    routerLink="/home"
  >
    InnoVITA Bill
  </a>
</nav>
<div
  class="d-flex justify-content-center align-items-center"
  style="min-height: 100vh; padding-top: 60px"
>
  <div class="card shadow p-4 w-100" style="max-width: 400px; border-radius: 12px;">

    <h3 class="mb-3 text-center text-success">Forgot Password</h3>

    <form [formGroup]="forgotForm">
      <div class="mb-3">
        <label for="email" class="form-label">Enter your Email</label>
        <input
          type="email"
          id="email"
          class="form-control"
          formControlName="superadmin_mail"
          placeholder="example@email.com"
          [class.is-invalid]="
            forgotForm.get('superadmin_mail')?.invalid &&
            forgotForm.get('superadmin_mail')?.touched
          "
        />

        <div
          class="invalid-feedback"
          *ngIf="
            forgotForm.get('superadmin_mail')?.invalid &&
            forgotForm.get('superadmin_mail')?.touched
          "
        >
          Please enter a valid email address
        </div>
      </div>
<div class="row w-100">
  <div class="col-8">
    <button
      class="btn btn-success w-100"
      (click)="forgot()"
      [disabled]="loading || forgotForm.invalid"
      style="font-size: 20px;"
    >
      {{ loading ? "Sending..." : "Send Reset Link" }}
    </button>
  </div>

  <div class="col-4">
    <button class="btn btn-success w-100" routerLink="/home">
  <i class="bi bi-box-arrow-left" style="font-size: 20px;"></i>
</button>

  </div>
</div>


    </form>

    <div class="mt-3 text-center">
      <span class="text-success" *ngIf="message">{{ message }}</span>
    </div>
  </div>
</div>
