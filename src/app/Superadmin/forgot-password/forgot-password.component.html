<div class="container mt-5" style="max-width: 400px;">
  <h3 class="mb-3 text-center">Forgot Password</h3>

  <form [formGroup]="forgotForm" >
    <div class="mb-3">
      <label for="email" class="form-label">Enter your Email</label>
      <input 
        type="email" 
        id="email" 
        class="form-control" 
        formControlName="superadmin_mail" 
        placeholder="example@email.com"
        [class.is-invalid]="forgotForm.get('superadmin_mail')?.invalid && forgotForm.get('superadmin_mail')?.touched">
      
      <div class="invalid-feedback" *ngIf="forgotForm.get('superadmin_mail')?.invalid && forgotForm.get('superadmin_mail')?.touched">
        Please enter a valid email address
      </div>
    </div>

   <button 
  type="button"
  class="btn btn-primary w-100" 
  (click)="forgot()"
  [disabled]="loading || forgotForm.invalid">
  {{ loading ? 'Sending...' : 'Send Reset Link' }}
</button>

  </form>

  <div class="mt-3 text-center">
    <span class="text-success" *ngIf="message">{{ message }}</span>
  </div>
</div>
