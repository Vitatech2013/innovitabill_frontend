<div class="container p-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="text-success fw-bold mb-0">
      <i class="bi bi-building me-2"></i>Inactive Business Types
    </h5>

    <div class="search-container">
      <input
        type="text"
        class="form-control shadow-sm"
        placeholder="Search..."
        [(ngModel)]="searchTerm"
        style="width: 100%; max-width: 300px"
      />
    </div>

    <a
      class="btn side-btn text-dark fw-semibold border-1"
      routerLink="/SuperAdminView/view_business_type"
      style="background-color: #f3f4f6"
    >
      <b><i class="bi bi-arrow-left-circle me-1"></i></b> Active
    </a>
  </div>

  <div style="max-height: 400px; overflow-y: auto">
    <table class="table table-bordered table-hover align-middle mb-0">
      <thead class="text-center">
        <tr>
          <th style="background: #d4f8d4; color: #0a5c0a">S.no</th>
          <th style="background: #d4f8d4; color: #0a5c0a">Business Type</th>
          <th style="background: #d4f8d4; color: #0a5c0a">Code</th>
          <th style="background: #d4f8d4; color: #0a5c0a">Status</th>
          <th style="background: #d4f8d4; color: #0a5c0a">Actions</th>
        </tr>
      </thead>

      <tbody class="text-center">
        <tr *ngFor="let b of filteredBusiness(); let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ b.business_type }}</td>
          <td>{{ b.business_code }}</td>
          <td>{{ b.status }}</td>
          <td>
            <button
              class="btn btn-sm btn-outline-danger"
              (click)="DeleteModal(b)"
            >
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
