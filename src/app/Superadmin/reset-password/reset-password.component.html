<nav class="navbar navbar-expand-lg navbar-dark bg-success body px-3 fixed-top">
  <a
    class="navbar-brand text-white fw-bold"
    routerLink="/home"
  >
    InnoVITA Bill
  </a>
</nav>

<div
  class="container d-flex justify-content-center align-items-center"
>
  <div class="card shadow p-4" >
    <div class="position-fixed top-0 end-0 p-4 toast" >
      <div *ngIf="toastMessage" class="custom-toast" [ngClass]="toastType">
        <div class="d-flex justify-content-between align-items-center">
          <span>{{ toastMessage }}</span>
          <button class="btn-close ms-3" (click)="toastMessage = null"></button>
        </div>
      </div>
    </div>
    <h3 class="text-center mb-3 text-success">Reset Password</h3>

    <form [formGroup]="resetForm" (ngSubmit)="update()">
      <div class="mb-3">
        <label class="form-label fw-semibold">New Password</label>
        <input
          type="password"
          formControlName="newPassword"
          class="form-control"
          placeholder="Enter new password"
        />
        <small
          class="text-danger"
          *ngIf="
            resetForm.get('newPassword')?.touched &&
            resetForm.get('newPassword')?.invalid
          "
        >
          Password is required (min 6 characters)
        </small>
      </div>

      <button
        class="btn btn-success w-100 mt-2"
        type="submit"
        [disabled]="resetForm.invalid"
      >
        Update Password
      </button>
    </form>
  </div>
</div>
