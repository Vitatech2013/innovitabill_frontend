<nav class="navbar navbar-expand-lg navbar-dark bg-success px-3">
  <span class="navbar-brand fw-bold body" routerLink="/home">
    InnoVITA Bill
  </span>
</nav>

<div class="container mt-5 pt-4 d-flex justify-content-center">

  <div class="card shadow-lg" style="max-width:900px; width:100%; border-radius:15px;">

    <div class="row g-0">
    
     <div class="col-md-7">
        <img
          src="/assets/business_images/login3_img.png"
          class="img-fluid h-100 w-100"
          style="object-fit:cover;border-top-left-radius:15px;border-bottom-left-radius:15px;"
        />
      </div>

    
   <div class="col-md-5 p-4 p-md-5">

      <h2 class="text-center fw-bold text-success mb-4">
        SuperAdmin Login
      </h2>

      <!-- YOUR SAME FORM -->
      <form [formGroup]="superAdminForm">

        <div class="mb-3">
          <label>Email</label>
          <input type="email"
                 formControlName="superadmin_mail"
                 class="form-control" />
        </div>

        <div class="mb-3">
          <label>Password</label>

          <div class="input-group">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="superadmin_password"
              class="form-control"
            />
            <button type="button"
                    class="btn btn-outline-secondary"
                    (click)="togglePassword()">
              <i class="bi"
                 [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'">
              </i>
            </button>
          </div>
        </div>

        <a routerLink="/forgot-password">forgot password?</a>

        <div class="d-flex gap-3 mt-3">
          <button type="button"
                  class="btn btn-success w-75"
                  (click)="SuperAdminLogin()">
            Login
          </button>

          <button type="button"
                  class="btn btn-success"
                  routerLink="/">
            <i class="bi bi-box-arrow-in-left"></i>
          </button>
        </div>

      </form>
</div>
    </div>
  </div>
</div>
<router-outlet></router-outlet>
