<div class="container mt-3">

  <!-- Tabs -->
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item">
      <button class="nav-link" [class.active]="activeTab==='daily'" (click)="setTab('daily')">Daily</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" [class.active]="activeTab==='weekly'" (click)="setTab('weekly')">Weekly</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" [class.active]="activeTab==='monthly'" (click)="setTab('monthly')">Monthly</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" [class.active]="activeTab==='yearly'" (click)="setTab('yearly')">Yearly</button>
    </li>
  </ul>

  <!-- Report Card -->
  <div class="card p-3">

    <h4 class="text-center mb-3 text-capitalize ">
      {{ activeTab }} Sales Report
    </h4>

    <!-- Chart -->
    <apx-chart 
      [series]="chartSeries"
      [chart]="chartOptions"
      [xaxis]="chartXAxis">
    </apx-chart>

    <div class="text-end mt-3">
      <button class="btn btn-danger me-2" (click)="downloadPDF()">Download PDF</button>
      <button class="btn btn-success" (click)="downloadExcel()">Download Excel</button>
    </div>
  </div>

</div>
