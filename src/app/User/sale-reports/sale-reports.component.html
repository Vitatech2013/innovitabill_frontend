<div class="container mt-3">

  <!-- Tabs -->
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item">
      <button class="nav-link" [class.active]="activeTab==='daily'" (click)="setTab('daily')"  data-toggle="tooltip" data-placement="top" title="Daily">Daily</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" [class.active]="activeTab==='weekly'" (click)="setTab('weekly')"  data-toggle="tooltip" data-placement="top" title="Weekly">Weekly</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" [class.active]="activeTab==='monthly'" (click)="setTab('monthly')"  data-toggle="tooltip" data-placement="top" title="Monthly">Monthly</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" [class.active]="activeTab==='yearly'" (click)="setTab('yearly')"  data-toggle="tooltip" data-placement="top" title="Yearly">Yearly</button>
    </li>
  </ul>

  <!-- Report Card -->
  <div class="card p-3">

    <h4 class="text-center fw-bold mb-3 text-capitalize text-success">
      {{ activeTab }} Sales Report
    </h4>

    <!-- Chart -->
    <apx-chart 
      [series]="chartSeries"
      [chart]="chartOptions"
      [xaxis]="chartXAxis">
    </apx-chart>

    <div class="text-end mt-3">
      <button class="btn btn-danger me-2" (click)="downloadPDF()"  data-toggle="tooltip" data-placement="top" title="Download Pdf" >Download PDF</button>
      <button class="btn btn-success" (click)="downloadExcel()" data-toggle="tooltip" data-placement="top" title="Download Excel">Download Excel</button>
    </div>
  </div>

</div>
