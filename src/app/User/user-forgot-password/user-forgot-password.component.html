<div class="container mt-5" style="max-width: 400px">
  <div class="row">
    <nav
      class="navbar navbar-expand-lg navbar-dark fixed-top bg-success px-3 w-100"
    >
      <a
        class="navbar-brand text-white fw-bold"
        style="cursor: pointer"
        routerLink="/home"
      >
        InnoVITA Bill
      </a>
    </nav>
  </div>

  <div class="row mt-5">
    <div class="col-md-6 justify-content-center">
      <div class="card" style="width: 20rem">
        <div class="row">
          <div class="card-header bg-success text-white">
            <h3 class="text-center fw-bold mb-4">Forgot Password</h3>
          </div>
        </div>
        <div class="row">
          <div class="card-body">
            <form [formGroup]="forgotUserForm">
              <div class="mb-3">
                <label for="email" class="form-label">Enter your Email</label>
                <input
                  type="email"
                  id="email"
                  class="form-control"
                  formControlName="user_email"
                  placeholder="example@email.com"
                  [class.is-invalid]="
                    forgotUserForm.get('user_email')?.invalid &&
                    forgotUserForm.get('user_email')?.touched
                  "
                />

                <div
                  class="invalid-feedback"
                  *ngIf="
                    forgotUserForm.get('user_email')?.invalid &&
                    forgotUserForm.get('user_email')?.touched
                  "
                >
                  Please enter a valid email address
                </div>
              </div>

              <button
                type="button"
                class="btn btn-primary w-100"
                (click)="forgot()"
                [disabled]="loading || forgotUserForm.invalid"
              >
                {{ loading ? "Sending..." : "Send Reset Link" }}
              </button>
            </form>

            <div class="mt-3 text-center">
              <span class="text-success" *ngIf="message">{{ message }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
