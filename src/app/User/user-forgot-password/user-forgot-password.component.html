<div class="container mt-5" style="max-width: 400px">
  <div class="row">
    <nav
      class="navbar navbar-expand-lg navbar-dark fixed-top bg-success px-3 w-100"
    >
      <a
        class="navbar-brand text-white fw-bold"
        style="cursor: pointer"
        routerLink="/home"
      >
        InnoVITA Bill
      </a>
    </nav>
  </div>

  <div class="row mt-5">
    <div class="col-md-6 justify-content-center">
      <div class="card forgot-card">
        <div class="card-header text-center">
          <h4 class="fw-bold mb-0">Forgot Password</h4>
        </div>

        <div class="card-body p-4">
          <form [formGroup]="forgotUserForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">Email address</label>
              <input
                type="email"
                class="form-control"
                formControlName="user_email"
                placeholder="example@email.com"
                [class.is-invalid]="
                  forgotUserForm.get('user_email')?.invalid &&
                  forgotUserForm.get('user_email')?.touched
                "
              />
              <div class="invalid-feedback">
                Please enter a valid email address
              </div>
            </div>

            <div class="d-flex gap-3">
              <button
                type="button"
                class="btn btn-success w-75 py-2 fw-semibold"
                (click)="forgot()"
                [disabled]="loading || forgotUserForm.invalid"
              >
                {{ loading ? "Sending..." : "Send Reset Link" }}
              </button>
              <button
                type="button"
                class="btn btn-success w-25 py-2 fw-semibold"
                routerLink="/"
              >
                <i class="bi bi-box-arrow-in-left"></i>
              </button>
            </div>
          </form>

          <div class="text-center mt-3">
            <span class="text-success fw-semibold" *ngIf="message">
              {{ message }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
