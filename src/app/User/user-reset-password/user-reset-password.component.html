<div class="container-fluid reset-bg">
  <nav
    class="navbar navbar-expand-lg navbar-dark fixed-top bg-success px-3 w-100"
  >
    <a class="navbar-brand text-white fw-bold" routerLink="/home">
      InnoVITA Bill
    </a>
  </nav>

  <div class="row">
    <div class="d-flex justify-content-center align-items-center min-vh-100">
      <div class="card reset-card">
        <div class="position-fixed top-0 end-0 p-4" style="z-index: 1080">
          <div *ngIf="toastMessage" class="custom-toast" [ngClass]="toastType">
            <div class="d-flex justify-content-between align-items-center">
              <span>{{ toastMessage }}</span>
              <button
                class="btn-close ms-3"
                (click)="toastMessage = null"
              ></button>
            </div>
          </div>
        </div>

        <div class="card-header text-center">
          <h4 class="fw-bold mb-1">Reset Password</h4>
        </div>

        <div class="card-body px-4 pb-4">
          <form [formGroup]="resetForm" (ngSubmit)="updateUser()">
            <div class="mb-3">
              <label class="form-label fw-semibold">New Password</label>
              <input
                type="password"
                formControlName="newPassword"
                class="form-control"
                placeholder="Enter new password"
              />
              <small
                class="text-danger"
                *ngIf="
                  resetForm.get('newPassword')?.touched &&
                  resetForm.get('newPassword')?.invalid
                "
              >
                Minimum 6 characters required
              </small>
            </div>

            <button
              class="btn btn-success w-100 py-2 fw-semibold"
              type="submit"
              [disabled]="resetForm.invalid"
            >
              Update Password
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
