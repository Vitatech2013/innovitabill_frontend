<nav class="navbar navbar-expand-lg bg-success px-3 w-100">
  <button
    class="btn btn-outline-light me-2"
    style="font-size: small"
    (click)="toggleSidebar()"
    data-toggle="tooltip" data-placement="top" title="Menu"
  >
    <i class="bi" [ngClass]="sidebarOpen ? 'bi-list' : 'bi-list'"></i>
  </button>
  <a
    class="navbar-brand text-light fw-bold"
    style="cursor: pointer"
    routerLink="/home"
  >
    InnoVITA Bill
  </a>
  

  <div class="collapse navbar-collapse" id="navbarSupportedContent"></div>
  <div class="d-flex ms-auto align-items-center header-right">
    <div
      class="me-3 text-white text-end flex-column"
      [class.d-none]="!sidebarOpen"
      [class.d-md-flex]="true"
    >
      <div class="fw-bold">{{ loggedInUser?.name }}</div>
      <small><b>Role</b> : {{ loggedInUser?.role }}</small>
    </div>
    <div
      class="dropdown"
      [class.d-none]="!sidebarOpen"
      [class.d-md-flex]="true"
    >
      <a
        class="btn btn-outline-light rounded-circle"
        style="font-size: small"
        id="userMenuButton"
        data-bs-toggle="dropdown"
        aria-expanded="false"
        data-toggle="tooltip" data-placement="top" title="Profile"
      >
        <i class="bi bi-person"></i>
      </a>

      <ul
        class="dropdown-menu dropdown-menu-end"
        aria-labelledby="userMenuButton"
      >
        <li>
          <a class="dropdown-item" [routerLink]="['/provider/profile']"
            >Profile</a
          >
        </li>
        <li><a class="dropdown-item" (click)="logout()">Logout</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container-fluid">
  <div class="d-flex flex-grow-1">
    <nav
      class="sidebar bg-white border-end p-3 d-flex flex-column"
      [class.sidebar-collapsed]="!sidebarOpen"
      [class.sidebar-mobile-open]="sidebarOpen"
    >
      <ul class="nav flex-column flex-grow-1" (click)="closeSidebarOnMobile()">
        <li class="nav-item">
          <a
            class="nav-link d-flex align-items-center"
            routerLink="/userview/itemlist"
            routerLinkActive="active"
            data-toggle="tooltip" data-placement="top" title="Item's List"
          >
            <i class="bi bi-list-check me-2"></i>
            <span class="link-text">Item's List</span>
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link d-flex align-items-center"
            routerLink="/userview/items"
            routerLinkActive="active"
            data-toggle="tooltip" data-placement="top" title="Add Item"
          >
            <i class="bi bi-plus-circle me-2"></i>
            <span class="link-text">Add Item</span>
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link d-flex align-items-center"
            routerLink="/userview/saleslist"
            routerLinkActive="active"
            data-toggle="tooltip" data-placement="top" title="Sale's List"
          >
            <i class="bi bi-file-earmark-bar-graph me-2"></i>
            <span class="link-text">Sale's List</span>
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link d-flex align-items-center"
            routerLink="/userview/sale"
            routerLinkActive="active"
            data-toggle="tooltip" data-placement="top" title="Create Sale"
          >
            <i class="bi bi-cart-plus me-2"></i>

            <span class="link-text">Create Sale</span>
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link d-flex align-items-center"
            routerLink="/userview/salereports"
            routerLinkActive="active"
            data-toggle="tooltip" data-placement="top" title="Sale's Reports"
          >
            <i class="bi bi-bar-chart me-2"></i>
            <span class="link-text">Sale's Reports</span>
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link d-flex align-items-center"
            routerLink="/userview/purchase"
            routerLinkActive="active"
            data-toggle="tooltip" data-placement="top" title="Create Purchase"
          >
            <i class="bi bi-bag me-2"></i>
            <span class="link-text">Create Purchase</span>
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link d-flex align-items-center"
            routerLink="/userview/purchaselist"
            routerLinkActive="active"
            data-toggle="tooltip" data-placement="top" title="Purchase List"
          >
            <i class="bi bi-cart-check me-2"></i>

            <span class="link-text"> Purchase List</span>
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link d-flex align-items-center"
            routerLink="/userview/quotation"
            routerLinkActive="active"
            data-toggle="tooltip" data-placement="top" title="Quotation"
          >
            <i class="bi bi-receipt-cutoff me-2"></i>
            <span class="link-text"> Quotation</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="flex-grow-1 w-100 content-area" (click)="closeSidebarOnMobile()">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
