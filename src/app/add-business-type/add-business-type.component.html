<div class="container-fluid">
  <div
    class=" border-0 "
    style="max-width: 700px"
  >
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h5 class="text-success fw-bold mb-0">
        <i class="bi bi-plus-circle me-2"></i>
        {{ selectedBusiness ? "Update Business Type" : "Add Business Type" }}
      </h5>
    </div>

    <form
      [formGroup]="addBusinessTypeForm"
      (ngSubmit)="saveBusiness()"
      enctype="multipart/form-data"
    >
      <div class="row g-3">
        <div class="col-md-12">
          <label class="form-label fw-semibold">
            Name <span class="text-danger">*</span>
          </label>
          <input
            type="text"
            class="form-control"
            formControlName="business_type"
            placeholder="Enter business type"
          />
          <small *ngIf="isInvalid('business_type')" class="text-danger">
            Business Type is required and must be at least 3 letters
          </small>
        </div>

        <div class="col-md-12">
          <label class="form-label fw-semibold">
            Business Code <span class="text-danger">*</span>
          </label>
          <input
            type="text"
            class="form-control"
            formControlName="business_code"
            placeholder="Enter business code"
          />
          <small *ngIf="isInvalid('business_code')" class="text-danger">
            Business code is required and must be at least 3 letters
          </small>
        </div>
      </div>

      <div class="row mt-4">
        <div class="col-6 d-flex justify-content-start ">
          <!-- <button
            type="button"
            class="btn btn-secondary px-4"
            (click)="cancelAdd()"
          >
            <i class="bi bi-x-circle me-1"></i> Cancel
          </button> -->

          <button type="submit" class="btn btn-success px-4">
            <i class="bi bi-save me-1"></i>
            {{ selectedBusiness ? "Update" : "Save" }}
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
