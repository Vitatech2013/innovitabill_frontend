<div class="text-start p-4">
  <button class="btn btn-success" (click)="toggleAddForm()">
    <i class="bi bi-plus-circle me-2"></i> Add Business
  </button>
</div>

<!-- ✅ Add Business Form (shown only when addFormVisible = true) -->
<div *ngIf="addFormVisible" class="card shadow-sm p-4 mb-4">
  <h5 class="text-success mb-3">Add Business</h5>

  <form [formGroup]="addBusinesForm" (ngSubmit)="addbusiness()">
    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Business Name</label>
        <input
          type="text"
          class="form-control"
          formControlName="business_name"
          required
        />
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label">Owner Name</label>
        <input
          type="text"
          class="form-control"
          formControlName="owner_name"
          required
        />
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label">Phone Number</label>
        <input
          type="text"
          class="form-control"
          formControlName="phone_number"
          required
        />
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label">Business Type</label>
        <input
          type="text"
          class="form-control"
          formControlName="business_type"
          required
        />
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label">Business Address</label>
        <input
          type="text"
          class="form-control"
          formControlName="business_address"
          required
        />
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label">Registration Number</label>
        <input
          type="text"
          class="form-control"
          formControlName="registration_number"
          required
        />
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label">GST Number</label>
        <input
          type="text"
          class="form-control"
          formControlName="gst_number"
          required
        />
      </div>
    </div>

    <div class="text-end mt-3">
      <button
        type="button"
        class="btn btn-secondary me-2"
        (click)="cancelAdd()"
      >
        Cancel
      </button>
      <button
        type="submit"
        class="btn btn-success"
        [disabled]="addBusinesForm.invalid"
      >
        Save
      </button>
    </div>
  </form>
</div>
