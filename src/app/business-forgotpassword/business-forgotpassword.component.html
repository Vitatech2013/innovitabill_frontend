<div class="container p-5 text-center">
  <h2 class="title mb-3 p-2">Forgot Password?</h2>
  <p class="text-muted">
    Enter your registered email. You will receive an OTP to reset your password.
  </p>

  <form [formGroup]="businessForm" >
    <!-- Email Input -->
    <div class="mb-3 w-25 mx-auto">
      <input
        type="email"
        class="form-control text-center"
        placeholder="example@gmail.com"
        formControlName="email"
      />

      <!-- Validation Messages -->
      <div *ngIf="businessForm.controls['email']?.touched && businessForm.controls['email']?.invalid" class="mt-2">
        <small *ngIf="businessForm.controls['email']?.errors?.['required']" class="text-danger">
          Email is required
        </small>
        <small *ngIf="businessForm.controls['email']?.errors?.['email']" class="text-danger">
          Invalid email format
        </small>
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn btn-primary w-10 m-2" (click)="sendOtp()">Send OTP</button>
    <button type="submit" class="btn btn-secondary w-10 m-2" (click)="logout()">cancel</button>
  </form>
</div>
