
<div class="hom1">
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow mt-5">
        <div class="card-header text-center">
          <h3 style="color: red">
            Login From<br /><small style="color: black; font-size: small"
              >(Manager)</small
            >
          </h3>
        </div>
        <div class="card-body">
          <form [formGroup]="cashierForm">
            <div class="mb-3">
              <label for="phone" class="form-label">Phone Number</label>
              <input
                type="text"
                id=""
                class="form-control"
                formControlName="mobile_number"
              />
               <div *ngIf="
                    cashierForm.get('mobile_number')?.touched &&
                    cashierForm.get('mobile_number')?.invalid"
                  style="color: red">
                  <small *ngIf="cashierForm.get('mobile_number')?.errors?.['required']">Phonenumber is required</small>
                  <small *ngIf="cashierForm.get('mobile_number')?.errors?.['minlength']">Atleast 10 Digits </small>
                </div>
            
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="text"
                id=""
                class="form-control"
                formControlName="password"
              />
               <div *ngIf="
                    cashierForm.get('password')?.touched &&
                    cashierForm.get('password')?.invalid"
                  style="color: red">
                  <small *ngIf="cashierForm.get('password')?.errors?.['required']">Password is required</small>
                  <small *ngIf="cashierForm.get('password')?.errors?.['minlength']">Atleast 5 Digits </small>
                </div>
            </div>

            <div class="text-center">
              <button
                type="submit"
                class="btn btn-login w-100 mt-3"
                (click)="cashierLogin()"
              >
                 Sign-in
              </button>
            </div>
            <div class="text-end mt-1">
  <a routerLink="/forgotpassword" class="text-decoration-none" style="font-size: 14px; color: blue; white-space: nowrap;">
    Forgot Password?
  </a>
</div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
