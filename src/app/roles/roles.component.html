<button
  class="btn btn-success mb-3"
  data-bs-toggle="modal"
  data-bs-target="#roleModal"
  (click)="openAddModal()"
>
  <i class="bi bi-plus-circle"></i>
  Add Role
</button>

<div class="dashboard">
  <h2 class="title mb-2 p-1 text-center">List of Roles</h2>

  <div class="row">
    <table class="table table-bordered">
      <thead class="table-success">
        <tr>
          <th>Sl.no</th>
          <th>Role Name</th>
          <th>Role Number</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of roles; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ r.role_name }}</td>
          <td>{{ r.role_number }}</td>
          <td>{{ r.status }}</td>
          <td>
            <button
              class="btn btn-primary btn-sm me-1"
              (click)="edit(r)"
              data-bs-toggle="modal"
              data-bs-target="#roleModal"
            >
              <i class="bi bi-pencil-square"></i>
            </button>
            <button
              class="btn btn-danger btn-sm me-1"
              (click)="delete(r._id)"
              data-bs-toggle="modal"
              data-bs-target="#roleModal"
            >
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Role Modal -->
<div
  class="modal fade"
  #roleModal
  id="roleModal"
  tabindex="-1"
  aria-labelledby="roleModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form [formGroup]="roleForm" (ngSubmit)="createOrUpdateRole()">
        <div class="modal-header">
          <h5 class="modal-title" id="roleModalLabel">{{ title }}</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
            (click)="closeModal()"
          ></button>
        </div>

        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Role Name</label>
            <input
              type="text"
              formControlName="role_name"
              class="form-control"
              placeholder="Enter role name"
            />
            <div
              *ngIf="
                roleForm.controls['role_name']?.touched &&
                roleForm.controls['role_name']?.invalid
              "
            >
              <small
                *ngIf="roleForm.controls['role_name']?.errors?.['required']"
                class="text-danger"
              >
                Role Name is required and must be at least 3 letters</small
              >
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Role Number</label>
            <input
              type="text"
              formControlName="role_number"
              class="form-control"
              placeholder="Enter role number"
            />
            <div
              *ngIf="
                roleForm.controls['role_number']?.touched &&
                roleForm.controls['role_number']?.invalid
              "
            >
              <small
                *ngIf="roleForm.controls['role_number']?.errors?.['required']"
                class="text-danger"
                >Role Number is required</small
              >
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
            (click)="closeModal()"
          >
            Close
          </button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
