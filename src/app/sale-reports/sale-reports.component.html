<div class="container" id="report-content">
  <h2 class="mb-4 text-center">Sales Reports</h2>

  <div class="row">
    <div class="col-md-6 mb-4">
      <div class="card p-3">
        <h4 class="text-center mb-2">Daily Sales</h4>
        <apx-chart
          [series]="dailySeries"
          [chart]="chartOptions"
          [xaxis]="dailyXAxis"
        ></apx-chart>
      </div>
    </div>

    <div class="col-md-6 mb-4">
      <div class="card p-3">
        <h4 class="text-center mb-2">Weekly Sales</h4>
        <apx-chart
          [series]="weeklySeries"
          [chart]="chartOptions"
          [xaxis]="weeklyXAxis"
        ></apx-chart>
      </div>
    </div>

    <div class="col-md-6 mb-4">
      <div class="card p-3">
        <h4 class="text-center mb-2">Monthly Sales</h4>
        <apx-chart
          [series]="monthlySeries"
          [chart]="chartOptions"
          [xaxis]="monthlyXAxis"
        ></apx-chart>
      </div>
    </div>

    <div class="col-md-6 mb-4">
      <div class="card p-3">
        <h4 class="text-center mb-2">Yearly Sales</h4>
        <apx-chart
          [series]="yearlySeries"
          [chart]="chartOptions"
          [xaxis]="yearlyXAxis"
        ></apx-chart>
      </div>
    </div>
  </div>
</div>
