<div *ngIf="!isCreatingInvoice()">
  <div
    class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2"
  >
    <h4 class="mb-3">Sales</h4>
    <input
      type="text"
      class="form-control"
      placeholder="Search by name, brand, or status..."
      [(ngModel)]="searchTerm"
      style="max-width: 300px"
    />

    <a
      class="btn btn-success text-white"
      [routerLink]="['/userview/saleslist/salereports']"
      routerLinkActive="active"
    >
      <i class="bi bi-bar-chart me-1"></i> Sale Reports
    </a>
  </div>

  <div class="table-responsive">
    <table
      class="table table-striped table-bordered table-hover text-center align-middle"
    >
      <thead class="table-success">
        <tr>
          <th>#</th>
          <th>Invoice No</th>
          <th>Customer Name</th>
          
          <th>Quantity</th>
          <th>Price</th>
          <!-- <th>Total</th> -->
          <th>Grand total</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let sale of filteredSales(); let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ sale.invoice_number }}</td>

          <td>{{ sale.customer_id?.name || "N/A" }}</td>
         

          <td>
            <div *ngFor="let p of sale.product_ids">
              {{ p.quantity }}
            </div>
          </td>

          <td>
            <div *ngFor="let p of sale.product_ids">₹{{ p.selling_price }}</div>
          </td>

          <!-- <td>
            <div *ngFor="let p of sale.product_ids">₹{{ p.total }}</div>
          </td> -->

          <td>₹{{ sale.grand_total }}</td>

          <td>{{ sale.payment_status || "Pending" }}</td>

          <td class="d-flex btn-group">
            <button
              class="btn btn-success"
              data-bs-toggle="modal"
              data-bs-target="#myEmptyModal"
              (click)="view(sale)"
            >
              <b><i class="bi bi-eye"></i></b>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<router-outlet></router-outlet>

<!-- View Invoice Modal -->
<div
  class="modal fade"
  id="myEmptyModal"
  tabindex="-1"
  aria-labelledby="myEmptyModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="myEmptyModalLabel">Sale Details</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>

      <div class="modal-body">
        <div class="card shadow-sm p-3 mb-4 border-0 small-card">
          <form [formGroup]="editForm">
            <div class="card-body">
              <div class="row">
                <div class="col-md-4">
                  <label class="form-label">Invoice No</label>
                  <input
                    type="text"
                    class="form-control p-2"
                    formControlName="invoice_number"
                  />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Customer Name</label>
                  <input
                    type="text"
                    class="form-control p-2"
                    formControlName="name"
                  />
                </div>
                <!-- <div class="col-md-4">
                  <label class="form-label">Item Name</label>
                  <input
                    type="text"
                    class="form-control p-2"
                    formControlName="item_name"
                  />
                </div> -->

                <!-- <div>
                  <label class="form-label">Item Id</label>
                  <input
                    type="text"
                    class="form-control p-2"
                    formControlName="item_id"
                  />
                </div> -->
                <div class="col-md-4">
                  <label class="form-label">Quantity</label>
                  <input
                    type="text"
                    class="form-control p-2"
                    formControlName="quantity"
                  />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Price</label>
                  <input
                    type="text"
                    class="form-control p-2"
                    formControlName="selling_price"
                  />
                </div>
                <!-- <div class="col-md-4">
                  <label class="form-label">Total</label>
                  <input
                    type="text"
                    class="form-control p-2"
                    formControlName="total"
                  />
                </div> -->
                <div class="col-md-4">
                  <label class="form-label">Grand total</label>
                  <input
                    type="text"
                    class="form-control p-2"
                    formControlName="grand_total"
                  />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Status</label>
                  <input
                    type="text"
                    class="form-control p-2"
                    formControlName="payment_status"
                  />
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
