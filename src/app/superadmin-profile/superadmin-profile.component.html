<div class="container mt-4">
  <h5 class="text-center text-success mb-3">Superadmin Profile</h5>
  <div class="card shadow-lg border-0 p-4">
    <div class="row align-items-center">
      <div class="col-md-4 text-center mb-3 mb-md-0">
       <img
  [src]="getImageUrl(superadminData?.image || previewUrl)"
  alt="Profile Image"
  class="img-fluid rounded-circle shadow-sm"
  width="150"
  height="150"
/>


        <h5 class="mt-3 fw-semibold">
          {{ profileForm.get("superadmin_name")?.value || "Superadmin" }}
        </h5>

        <button
          class="btn btn-sm btn-primary mt-2"
          data-bs-toggle="modal"
          data-bs-target="#editProfileModal"
          (click)="profileedit()"
        >
          <i class="bi bi-pencil"></i> Edit Profile
        </button>
      </div>

      <div class="col-md-8">
        <form [formGroup]="profileForm">
          <div class="row">
            <div class="col-md-6 border-end">
              <h6 class="fw-bold text-primary mb-3">Profile Information</h6>

              <div class="mb-3">
                <label class="form-label fw-semibold">Name</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="superadmin_name"
                  readonly
                />
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Phone Number</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="superadmin_number"
                  readonly
                />
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="superadmin_mail"
                  readonly
                />
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input
                  type="password"
                  class="form-control"
                  formControlName="superadmin_password"
                  readonly
                />
              </div>
            </div>

            <div class="col-md-6 ps-md-4">
              <h6 class="fw-bold text-primary mb-3">Address Details</h6>
              <div formGroupName="address" class="row">
                <div class="col-md-6 mb-3" *ngFor="let field of addressFields">
                  <label class="form-label fw-semibold">{{
                    field.label
                  }}</label>
                  <input
                    type="text"
                    class="form-control"
                    [formControlName]="field.name"
                    readonly
                  />
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div
  class="modal fade"
  id="editProfileModal"
  tabindex="-1"
  aria-labelledby="editProfileModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content shadow-lg">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="editProfileModalLabel">
          Edit Superadmin Profile
        </h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="modal"
        ></button>
      </div>

      <div class="modal-body">
        <form
          [formGroup]="profileForm"
          (ngSubmit)="updateadminprofile()"
          enctype="multipart/form-data"
        >
          <div class="row">
            <div
              class="col-md-5 text-center d-flex flex-column align-items-center justify-content-center"
            >
              <label for="fileInput" style="cursor: pointer">
               <img
  [src]="getImageUrl(superadminData?.image || previewUrl)"
  alt="Profile Image"
  class="img-fluid rounded-circle shadow-sm"
  width="150"
  height="150"
/>

              </label>
              <input
                type="file"
                id="fileInput"
                class="d-none"
                (change)="onImageSelected($event)"
                accept="image/*"
              />
              <small class="text-muted">Click image to change</small>
            </div>

            <div class="col-md-7">
              <div class="mb-3">
                <label class="form-label">Name</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="superadmin_name"
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="superadmin_number"
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="superadmin_mail"
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  formControlName="superadmin_password"
                />
              </div>

              <h6 class="fw-bold mt-3">Address</h6>
              <div formGroupName="address" class="row">
                <div class="col-md-6 mb-2" *ngFor="let field of addressFields">
                  <label class="form-label">{{ field.label }}</label>
                  <input
                    type="text"
                    class="form-control"
                    [formControlName]="field.name"
                  />
                </div>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-success">
              Update Profile
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
